<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="TwoHearts">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>twohearts</title>
    <script
      type="module"
      src="assets/packages/model_viewer_plus/assets/model-viewer.min.js"
      defer
    ></script>
  </head>
  <body>
    <script>
      // Retire the old app-shell cache without touching accounts or local saves.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(async registrations => {
          const scope = new URL('.', document.baseURI).href;
          const own = registrations.filter(registration => registration.scope === scope);
          const controlled = !!navigator.serviceWorker.controller;
          await Promise.all(own.map(registration => registration.unregister()));
          if (controlled && own.length) location.reload();
        }).catch(() => {});
      }
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
