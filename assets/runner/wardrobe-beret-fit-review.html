<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Ajuste de boina</title>
<style>body{margin:0;background:#fff9f5;color:#453847;font:15px system-ui}main{max-width:740px;margin:auto;padding:20px}h1{font:700 29px Georgia;margin:0 0 8px}p{color:#716574;line-height:1.5}label{display:inline-flex;gap:8px;align-items:center;margin:7px 14px 7px 0}select{padding:10px;border:1px solid #dbc9db;border-radius:14px;background:#fff;color:#49384c;font:inherit}iframe{width:100%;height:590px;border:0;border-radius:28px;background:#fff1f3;margin-top:12px}small{display:block;margin:10px;color:#77667a}input{accent-color:#9b7bac}@media(max-width:500px){iframe{height:520px}main{padding:14px}}</style>
<main><h1>Una boina más cuidada</h1><p>Revisión de encaje sobre el pingüino original. La nueva copa está cerrada, tiene forro, costura completa y pequeños pliegues. Puedes compararla con la boina actual.</p>
<label>Modelo <select id="version"><option value="new">Nueva revisión</option><option value="current">Actual</option></select></label>
<label>Vista <select id="angle"><option value="40">Tres cuartos</option><option value="0">Frente</option><option value="90">Perfil</option><option value="180">Espalda</option></select></label>
<label>Movimiento <select id="motion"><option value="Natural_Rest">Reposo</option><option value="Wardrobe_Run">Carrera</option><option value="Natural_Jump">Salto</option></select></label>
<label>Instante <input id="phase" type="range" min="0" max="1" step=".05" value="0"></label><div id="viewport"></div><small>Prueba experimental de la prenda; el catálogo activo conserva la versión anterior.</small></main>
<script type="module">
const controls=Object.fromEntries(['version','angle','motion','phase'].map(k=>[k,document.getElementById(k)]));
const item=(await fetch('./accessory-catalog.json',{cache:'no-store'}).then(r=>r.json())).find(i=>i.item_key==='beret_chic');
function render(){const appearance=structuredClone(item.appearance);if(controls.version.value==='new'){appearance.model_asset='assets/runner/accessories/experimental_beret_chic_penguin_v6.glb';appearance.species_models={penguin:appearance.model_asset};appearance.asset_revision='beret-closed-sewn-v6';}
const params=new URLSearchParams({pet:'1',species:'penguin',wardrobe_original_review:'1',review_angle:controls.angle.value,review_motion:controls.motion.value,review_phase:controls.phase.value,appearance:JSON.stringify({pet_head:appearance}),v:'beret-closed-sewn-v6'}),frame=document.createElement('iframe');frame.title='Boina sobre el pingüino original';frame.src='./index.html?'+params;document.getElementById('viewport').replaceChildren(frame);}
for(const c of Object.values(controls))c.addEventListener('change',render);render();
</script></html>
