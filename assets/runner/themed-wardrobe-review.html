<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Aventuras de vestir</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff8f1;color:#453b40;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font:700 30px Georgia;margin:0 0 10px}nav{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:6px}select,input,button{font:inherit;color:#453b40;background:white;border:1px solid #c9b5ae;border-radius:12px;padding:9px}button{background:#a63c56;color:white;border:0}p{line-height:1.5}iframe{width:100%;height:650px;border:0;background:#f8ede7;border-radius:24px;margin-top:18px}a{color:#93364e}@media(max-width:600px){iframe{height:500px}main{padding:12px}}</style>
<main><h1>Aventuras de vestir</h1><p>Tres prendas nuevas sobre las mascotas originales. Vista de revisión: aún no se cobran. Princesa ya incorpora una tiara pequeña y el vestido detallado; los cascos de las otras temáticas siguen en preparación.</p>
<nav><label>Conjunto<select id="outfit"><option value="racer">Piloto de carreras</option><option value="space">Explorador espacial</option><option value="princess">Princesa del Nido</option></select></label><label>Mascota<select id="species"><option value="penguin">Pingüino</option><option value="bear">Oso</option><option value="pig">Cerdito</option><option value="chick">Pollito</option></select></label><label>Ver en<select id="mode"><option value="room">Habitación · 3D</option><option value="run">Carrera · 3D</option><option value="jump">Salto · 3D</option><option value="runner">Corre con tu mascota</option><option value="guardian">Guardianes · pixel art</option><option value="penalties">Penales · 3D</option></select></label><label>Ángulo<select id="angle"><option value="0">Frente</option><option value="40">Tres cuartos</option><option value="90">Perfil</option><option value="180">Espalda</option></select></label><label>Color de tela<input id="color" type="color" value="#C52D32"></label><button id="reset">Color original</button></nav>
<iframe id="stage" title="Prueba del conjunto"></iframe><p id="status" role="status">Preparando prendas…</p><a href="./guardian/wardrobe-review.html?outfit=racer">Ver las cuatro mascotas en pixel art</a></main>
<script type="module">
import {OUTFITS} from './guardian/wardrobe.js';
const $=id=>document.getElementById(id),controls=['outfit','species','mode','angle'],keys={racer:'jacket_racer',space:'suit_astronaut',princess:'dress_princess'};
let catalog=[],appearance={};const q=new URLSearchParams(location.search);for(const id of controls)if([...$(id).options].some(o=>o.value===q.get(id)))$(id).value=q.get(id);
function look(){const definitions=new Map(catalog.map(i=>[i.item_key,i]));return Object.fromEntries(OUTFITS[$('outfit').value].map(raw=>{const item=typeof raw==='string'?{item_key:raw}:raw,definition=definitions.get(item.item_key);if(!definition)throw Error('Falta la prenda '+item.item_key);const a=structuredClone(definition.appearance);a.item_key=item.item_key;if(item.color)a.garment_color=item.color;if(definition.equip_slot==='pet_body')a.garment_color=$('color').value;return [definition.equip_slot,a];}));}
function render(){appearance=look();const mode=$('mode').value,params=new URLSearchParams({species:$('species').value,appearance:JSON.stringify(appearance),preview:'1',v:'themed-wardrobe-1'});let page='./index.html';if(mode==='guardian')page='./guardian/index.html';else if(mode==='penalties')page='./penalties/index.html';else if(mode!=='runner'){params.set('pet','1');params.set('room','1');params.set('wardrobe_original_review','1');params.set('review_angle',$('angle').value);params.set('review_motion',mode==='run'?'Wardrobe_Run':mode==='jump'?'Natural_Jump':'Natural_Rest');} $('stage').src=page+'?'+params;history.replaceState(null,'','?'+new URLSearchParams(Object.fromEntries(controls.map(id=>[id,$(id).value]))));$('status').textContent='Prueba de '+catalog.find(i=>i.item_key===keys[$('outfit').value]).name+' · Cambiar el color actualiza la misma escena.';}
function defaultColor(){return catalog.find(i=>i.item_key===keys[$('outfit').value]).appearance.color_base;}
try{const lists=await Promise.all(['accessory-catalog.json','themed-wardrobe-candidates.json'].map(async path=>{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar el vestuario');return r.json();}));catalog=lists.flat();$('color').value=defaultColor();for(const id of controls)$(id).onchange=()=>{if(id==='outfit')$('color').value=defaultColor();render();};$('color').oninput=()=>{appearance=look();$('stage').contentWindow?.postMessage({type:'nido-appearance',appearance},location.origin);};$('reset').onclick=()=>{$('color').value=defaultColor();appearance=look();$('stage').contentWindow?.postMessage({type:'nido-appearance',appearance},location.origin);};render();}catch(error){$('status').textContent=error.message;}
</script></html>
