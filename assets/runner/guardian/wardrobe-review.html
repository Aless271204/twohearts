<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Vestuario pixel art</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#fff7ef;color:#493b3e;font:15px system-ui}main{max-width:1150px;margin:auto}h1{margin:0;color:#a94e66}p{line-height:1.5}label{display:inline-flex;gap:10px;align-items:center;margin:8px 15px 8px 0}select,button,a{font:inherit;border:1px solid #e7bec9;border-radius:14px;background:#fff;padding:10px;color:#493b3e}a{display:inline-block;text-decoration:none;background:#f05b85;color:#fff}#pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}article{background:#fae9e7;border-radius:24px;text-align:center;padding:18px}article:nth-child(even){background:#eef1e4}canvas{width:100%;aspect-ratio:1;image-rendering:pixelated}h2{font-size:17px;margin:0}small{display:block;color:#796a70;margin:12px}#status{font-weight:700}</style>
<main><h1>NIDO · Vestuario pixel art</h1><p>Prendas del inventario en las cuatro mascotas. Esta vista muestra el catálogo para revisar su aspecto; las compras y lo equipado se conservan en tu cuenta.</p>
<label>Conjunto <select id="outfit"><option value="dulce">Dulce</option><option value="cozy">Cozy</option><option value="jardin">Jardín</option><option value="chic">Chic</option><option value="pastel">Pastel</option><option value="racer">Piloto de carreras · prueba</option><option value="space">Astronauta · prueba</option><option value="princess">Princesa · prueba</option></select></label>
<label>Prenda individual <select id="item"><option value="">Conjunto completo</option></select></label>
<label>Movimiento <select id="pose"><option value="0">Reposo</option><option value="1">Carrera</option><option value="2">Salto</option><option value="3">Deslizar</option><option value="4">Disparar</option><option value="5">Caída</option></select></label>
<button id="live" aria-pressed="false">Ver poses en secuencia</button><p id="status">Preparando las prendas…</p><section id="pets"></section><a id="play" href="index.html?preview=1&outfit=dulce">Probar en la aventura</a><small>La prueba del navegador no añade oro ni desbloquea productos.</small></main>
<script type="module">
import {GuardianRenderer,NAMES} from './render.js?revision=feet-integrated-2';import {ITEMS,OUTFITS} from './wardrobe.js';
const query=new URLSearchParams(location.search);
const $=id=>document.getElementById(id),renderer=new GuardianRenderer(document.createElement('canvas'));let loaded=false,live=false,pose=0;
const names={cap_pink:'Gorra corazón',beanie_cloud:'Gorro nube',hat_garden:'Sombrero jardín',beret_chic:'Boina chic',glasses_heart:'Gafas corazón',glasses_round:'Lentes redondos',glasses_star:'Gafas estrella',patch_pirate:'Parche pirata',mask_sleep:'Antifaz sueño',scarf_hearts:'Bufanda suave',bandana_sage:'Pañuelo salvia',necklace_heart:'Collar corazón',chain_gold:'Cadena dorada',bow_neck:'Moño elegante',shirt_love:'Camiseta abrazo',jacket_denim:'Chaqueta denim',coat_cloud:'Abrigo nube',dress_petal:'Vestido pétalo',hoodie_nido:'Sudadera nido',shoes_heart:'Zapatillas corazón',boots_rain:'Botitas lluvia',slippers_cloud:'Pantuflas nube',shoes_chic:'Zapatos chic',sandals_summer:'Sandalias verano'};
for(const key of Object.keys(ITEMS)){const option=document.createElement('option');option.value=key;option.textContent=names[key]??({jacket_racer:"Piloto de carreras",suit_astronaut:"Astronauta",dress_princess:"Princesa",tiara_princess:"Tiara corazón",shirt_sunday:"Camisa de domingo",sweater_forest:"Suéter bosque",jacket_leather:"Chaqueta café",tee_everyday:"Camiseta esencial"}[key]??key);$('item').append(option);}
if(ITEMS[query.get('item')])$('item').value=query.get('item');if(OUTFITS[query.get('outfit')])$('outfit').value=query.get('outfit');if(query.has('pose')){pose=Math.max(0,Math.min(5,Number(query.get('pose'))||0));$('pose').value=String(pose);}
const cards=Object.keys(NAMES).map(species=>{const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas');title.textContent=NAMES[species];canvas.width=canvas.height=320;article.append(title,canvas);$('pets').append(article);return {species,canvas};});
function draw(){if(!loaded)return;const items=$('item').value?[$('item').value]:OUTFITS[$('outfit').value];for(const {species,canvas}of cards){const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,320,320);ctx.drawImage(renderer.wardrobe.frame(species,pose,items),0,0);} $('play').href='index.html?preview=1&outfit='+$('outfit').value;}
for(const id of ['outfit','item','pose'])$(id).onchange=()=>{if(id==='pose')pose=Number($('pose').value);draw();};$('live').onclick=()=>{live=!live;$('live').setAttribute('aria-pressed',String(live));$('live').textContent=live?'Detener secuencia':'Ver poses en secuencia';};
try{await renderer.load();loaded=true;$('status').textContent=Object.keys(ITEMS).length+' artículos · 4 mascotas · 6 poses';draw();}catch{$('status').textContent='No se pudieron cargar las prendas. Recarga la página.';}
setInterval(()=>{if(live&&!document.hidden){pose=(pose+1)%6;$('pose').value=String(pose);draw();}},800);
</script></html>
