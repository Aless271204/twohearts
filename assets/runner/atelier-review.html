<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Taller de ropa y habitación</title>
<style>body{margin:0;background:#fff8f1;color:#453a35;font:15px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font:700 30px Georgia;margin:0 0 10px}p{line-height:1.5;color:#68554c}nav{display:flex;gap:12px;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}select{font:inherit;color:#453a35;background:#fff;border:1px solid #cdb9a9;border-radius:12px;padding:10px}iframe{display:block;width:100%;height:640px;border:0;background:#f8ece1;border-radius:24px;margin-top:18px}small{display:block;margin:12px 0;color:#68554c}@media(max-width:600px){iframe{height:520px}main{padding:12px}}</style>
<main><h1>El taller del Nido</h1><p>Modelos reales sobre las cuatro mascotas originales. Revisión experimental: estos artículos nuevos aún no se venden. <a href="./room-themes-review.html" style="color:#9f3d57">Explorar habitaciones temáticas</a> · <a href="./themed-wardrobe-review.html">Ropa temática</a></p><nav>
<label>Mascota <select id="species"><option value="penguin">Pingüino</option><option value="bear">Oso</option><option value="pig">Cerdito</option><option value="chick">Pollito</option></select></label>
<label>Artículo <select id="item"></select></label><label>Vista <select id="angle"><option value="40">Tres cuartos</option><option value="0">Frente</option><option value="90">Perfil</option><option value="180">Espalda</option></select></label>
<label>Movimiento <select id="motion"><option value="Natural_Rest">Descanso</option><option value="Wardrobe_Run">Carrera</option><option value="Natural_Jump">Salto</option></select></label>
<label><input type="checkbox" id="live" checked>Animar</label></nav><iframe id="stage" title="Revisión del artículo 3D"></iframe><small id="status" role="status"></small></main>
<script type="module">
const controls=Object.fromEntries(['species','item','angle','motion','live'].map(k=>[k,document.getElementById(k)]));
const read=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar '+p);return r.json();};
try{const [clothes,room,current,themed]=await Promise.all(['menswear-candidates.json','room-boutique-candidates.json','accessory-catalog.json','room-themed-candidates.json'].map(read));
const beret=structuredClone(current.find(i=>i.item_key==='beret_chic'));beret.appearance.species_models=Object.fromEntries(['penguin','bear','pig','chick'].map(sp=>[sp,`assets/runner/accessories/experimental_beret_chic_${sp}_v7.glb`]));beret.appearance.asset_revision='compact-beret-7';beret.name='Boina compacta · candidata';
const sandals=structuredClone(current.find(i=>i.item_key==='sandals_summer'));sandals.appearance.species_models=Object.fromEntries(['penguin','bear','pig','chick'].map(sp=>[sp,`assets/runner/accessories/fitted_sandals_summer_${sp}_v2.glb`]));sandals.appearance.asset_revision='sandal-uppers-lowered-2';sandals.name='Sandalias · lazos más bajos';
const all=[...clothes,beret,...current.filter(i=>['shoes_chic','shoes_heart','bandana_sage'].includes(i.item_key)),sandals,...room,...themed];
const groups=new Map();for(const i of all){const label=i.collection??(i.equip_slot.startsWith('room_')?'Rincones cálidos':'Vestuario');if(!groups.has(label)){const group=document.createElement('optgroup');group.label=label;groups.set(label,group);controls.item.append(group);}groups.get(label).append(new Option(i.name,i.item_key));}
const initial=new URLSearchParams(location.search);for(const key of ['species','item','angle','motion']){const value=initial.get(key);if(value&&[...controls[key].options].some(o=>o.value===value))controls[key].value=value;}controls.live.checked=initial.get('live')!=='0';
function render(){const item=all.find(i=>i.item_key===controls.item.value),sp=controls.species.value,roomItem=item.equip_slot.startsWith('room_'),a=structuredClone(item.appearance);if(a.species_models)a.model_asset=a.species_models[sp];if(a.coverage_assets)a.coverage_asset=a.coverage_assets[sp];if(a.headwear_occlusions)a.headwear_occlusion=a.headwear_occlusions[sp];
const state=new URLSearchParams(Object.fromEntries(['species','item','angle','motion'].map(k=>[k,controls[k].value])));state.set('live',controls.live.checked?'1':'0');history.replaceState(null,'','?'+state);
const params=new URLSearchParams({pet:'1',room:roomItem?'1':'0',species:sp,wardrobe_original_review:'1',review_angle:controls.angle.value,review_motion:controls.motion.value,appearance:JSON.stringify({[item.equip_slot]:a}),v:'atelier-v1'});if(!controls.live.checked)params.set('review_phase','.25');document.getElementById('stage').src='./index.html?'+params;document.getElementById('status').textContent=roomItem?'Objeto construido con el mismo sistema 3D que la habitación.':'Comprobar cuello, hombros, bajo y contacto durante todo el movimiento.';}
for(const c of Object.values(controls))c.addEventListener('change',render);render();
}catch(e){document.getElementById('status').textContent=e.message;}
</script></html>
