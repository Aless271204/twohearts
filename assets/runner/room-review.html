<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwoHearts · Habitación 3D</title>
<style>body{margin:0;padding:20px;background:#fff9fa;color:#29232c;font:14px system-ui}h1{font-size:23px}select{padding:9px;border:1px solid #efd3de;border-radius:12px;background:white}label{display:inline-block;margin:4px}#room{display:block;width:390px;max-width:100%;height:470px;border:0;border-radius:24px;margin:20px auto}#products{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.product{padding:12px;border-radius:20px;background:white;text-align:center}.product img{width:100%}@media(max-width:600px){#products{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<h1>Tu habitación, construida en 3D</h1><p>Vista de revisión · Modelos compartidos por el catálogo y la habitación. Sin compras.</p><div id="controls"></div><iframe id="room" title="Habitación con mascota"></iframe><h2>Piezas 3D: catálogo nuevo y colecciones existentes</h2><div id="products"></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';import {createRoomPiece} from './room-pieces.js';
const catalog=await fetch('room-catalog.json').then(r=>r.json()),selection={room_wall:{style:'sage_panel',color:'#b8dccb'},room_bed:{style:'cloud_bed',color:'#b8dccb'},room_plant:{style:'companion_plant',color:'#b8dccb'},room_decor:{style:'heart_frame',color:'#efa0ab'},room_ceiling:{style:'cloud',color:'#fff2df'}};
const species=document.createElement('select');species.setAttribute('aria-label','Mascota');for(const [key,name] of Object.entries({penguin:'Pingüino',bear:'Oso',pig:'Cerdito',chick:'Pollito'}))species.add(new Option(name,key));species.onchange=update;document.querySelector('#controls').append(species);
for(const slot of [...new Set(catalog.map(i=>i.equip_slot))]){const label=document.createElement('label'),select=document.createElement('select');select.setAttribute('aria-label',slot);select.add(new Option('Sin artículo',''));for(const i of catalog.filter(i=>i.equip_slot===slot))select.add(new Option(i.name,i.item_key));select.value=catalog.find(i=>i.equip_slot===slot&&i.appearance.style===selection[slot]?.style)?.item_key??'';select.onchange=()=>{const item=catalog.find(i=>i.item_key===select.value);if(item)selection[slot]=item.appearance;else delete selection[slot];update();};label.append(select);document.querySelector('#controls').append(label);}
function update(){document.querySelector('#room').src='index.html?'+new URLSearchParams({pet:'1',room:'1',species:species.value,appearance:JSON.stringify(selection)});}update();
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(512,512);renderer.setClearColor('#fff5f7');renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight('#fff6ee','#a4a6b5',1.6));const sun=new THREE.DirectionalLight('#ffffff',1.8);sun.position.set(-3,6,5);scene.add(sun);const fill=new THREE.DirectionalLight('#e1eeff',.8);fill.position.set(4,6,8);scene.add(fill);const camera=new THREE.PerspectiveCamera(36,1,.01,50);
const legacy=await fetch('../../docs/inventory-catalog.json').then(r=>r.json());const variants=[...catalog,...legacy.filter(i=>i.scope==='room').map(i=>({name:i.name,equip_slot:i.slot,appearance:{style:i.style,color:i.color}}))];
for(const item of variants){const root=createRoomPiece(item.appearance,item.equip_slot);scene.add(root);root.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(root),size=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=size.length()*1.65;camera.position.set(c.x+d*.30,c.y+d*.35,c.z+d);camera.lookAt(c);renderer.render(scene,camera);const card=document.createElement('div');card.className='product';const image=new Image();image.src=renderer.domElement.toDataURL('image/png');image.dataset.file=`room_${item.equip_slot}-${item.appearance.style}-${item.appearance.color.slice(1).toLowerCase()}.png`;image.alt=item.name;const label=document.createElement('p');label.textContent=item.name;card.append(image,label);document.querySelector('#products').append(card);scene.remove(root);root.traverse(o=>{o.geometry?.dispose();});}
renderer.dispose();document.body.dataset.ready='true';
</script></html>
