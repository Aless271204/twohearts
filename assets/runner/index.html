<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Corre en pareja · Bosque</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17392b;color:#fff;font:16px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}button{font:inherit;color:#fff;border:1px solid #ffffff55;background:#244d39;border-radius:18px;padding:14px 22px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #f8d569}button:disabled{opacity:.5}#hud{position:fixed;top:14px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;text-shadow:0 2px 5px #000}#pause{pointer-events:auto;padding:10px}#panel{position:fixed;inset:0;display:grid;place-items:center;background:#0b231c66}#card{width:min(420px,90vw);padding:28px;border-radius:26px;background:#17392bec;text-align:center;box-shadow:0 14px 70px #0006}h1{margin:0 0 12px;font-size:28px}p{line-height:1.5;color:#ddebd8}#start{background:#e5b947;color:#213323;font-weight:750}#controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:16px;right:16px;display:flex;gap:12px;justify-content:center}#jump{min-width:140px;background:#d9aa36;color:#17392b;font-weight:750}[hidden]{display:none!important}#toast{position:fixed;top:70px;width:100%;text-align:center;color:#ffe38a;font-weight:800;pointer-events:none}
</style>
<style>
#hud{justify-content:flex-start;gap:8px;top:12px;left:12px;right:12px;font-size:13px}#score{display:flex;gap:8px}#distance,#coins,#pause{padding:8px 12px;border:1px solid #fff5;border-radius:13px;background:#18382bc9;backdrop-filter:blur(10px);box-shadow:0 3px 12px #10251b22}#coins{color:#ffe09a}#pause{margin-left:auto}#controls{gap:9px;bottom:max(12px,env(safe-area-inset-bottom))}#controls button{padding:12px 18px;background:#173b2acc;backdrop-filter:blur(8px);border-color:#ffe5ac44}#controls #jump{background:#edc568e8;color:#28412a;min-width:112px}#biome{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:.08em;background:#173b2aba;border:1px solid #fff3;border-radius:15px;padding:8px 16px;backdrop-filter:blur(10px);pointer-events:none}#biome small{display:block;margin-top:3px;font-size:10px;letter-spacing:0;color:#e0ebcd}#card{background:#163d2bdc;border:1px solid #ffe4a644;backdrop-filter:blur(12px)}h1{font-size:26px}
</style>
<style>#music{pointer-events:auto;padding:8px 12px;border:1px solid #fff5;border-radius:13px;background:#18382bc9;backdrop-filter:blur(10px);font-size:16px}</style>
<div id="hud"><strong id="score"><span id="distance">0 m</span><span id="coins">♥ 0</span></strong><button id="music" aria-label="Silenciar audio">♪</button><button id="pause" aria-label="Pausar partida" disabled>Ⅱ</button></div>
<div id="toast"></div>
<div id="panel"><div id="card"><h1 id="title">Corre en pareja</h1><p id="message">Preparando tu bosque…</p><button id="start" disabled>Jugar</button><small style="display:block;margin-top:12px;opacity:.65">Versión 1.1.3</small></div></div>
<div id="controls"><button id="left" aria-label="Mover a la izquierda">←</button><button id="jump">Saltar</button><button id="right" aria-label="Mover a la derecha">→</button></div>
<style>.pet-only{background:transparent}.pet-only #hud,.pet-only #panel,.pet-only #controls,.pet-only #biome,.pet-only #toast{display:none}#progress{display:block;width:100%;height:5px;margin-top:6px;accent-color:#f6ce68}#goal{display:block;margin-top:4px;color:#ffe09a}#hud span,#biome,#controls button{backdrop-filter:none}</style>
<div id="biome">🌿 1. BOSQUE<small><span id="difficulty">Ritmo 1/5</span> · Un bosque lleno de vida</small><span id="record">🏆 Récord: 0 m</span><span id="goal">Siguiente hito · 500 m</span><progress id="progress" value="0" max="500"></progress></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
<script type="module" src="diagnostics.js"></script>
<script type="module" src="game.js"></script>
</html>
