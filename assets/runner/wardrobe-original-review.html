<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Atuendos y movimiento original</title>
<style>body{font:16px system-ui;background:#fff9fa;color:#292735;margin:24px}h1{font-size:25px}p{color:#6f6979;line-height:1.5}label{display:inline-flex;gap:8px;margin:8px}select,input{font:inherit;border:1px solid #edcbd5;border-radius:14px;padding:9px;background:white;color:#292735}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{border-radius:24px;overflow:hidden;background:#fbeeee;text-align:center}iframe{width:100%;height:490px;border:0}h2{font-size:17px}small{display:block;padding:12px;color:#6f6979}</style>
<h1>Atuendos · modelo original</h1><p>Prendas nuevas sobre tu GLB original. Puedes comparar el salto original con un ajuste de animación en prueba; todavía no son productos activados.</p>
<label>Prenda <select id="item"><option value="dulce">Conjunto Dulce</option><option value="shirt_love">Camiseta</option><option value="bow_neck">Lazo</option><option value="shoes_heart">Zapatillas</option><option value="cap_pink">Gorra</option></select></label>
<label>Vista <select id="angle"><option value="0">Frente</option><option value="40">Tres cuartos</option><option value="90">Perfil</option><option value="180">Espalda</option></select></label>
<label>Movimiento <select id="motion"><option value="">Reposo</option><option value="Running">Carrera original</option><option value="Wardrobe_Run">Carrera nueva (prueba)</option><option value="Regular_Jump">Salto original</option><option value="Natural_Jump">Salto nuevo (prueba)</option></select></label><label>Instante <input id="phase" type="range" min="0" max="1" step=".05" value="0"></label><main id="pets"></main>
<script type="module">
const params=new URLSearchParams(location.search),controls=Object.fromEntries(['item','angle','motion','phase'].map(k=>[k,document.getElementById(k)]));for(const [k,c]of Object.entries(controls))if(params.has(k))c.value=params.get(k);
const catalog=await fetch('./restart/catalog.json',{cache:'no-store'}).then(r=>r.json());const details=await fetch('./restart/details-catalog.json',{cache:'no-store'}).then(r=>r.json());
function equipment(sp){const selected=controls.item.value,loadout={},head=catalog.variants.find(v=>v.species===sp),shirt=catalog.wardrobe?.find(i=>i.item_key==='shirt_love')?.variants.find(v=>v.species===sp);
 const entries=[['cap_pink','pet_head',`assets/runner/accessories/restart_cap_pink_${sp}.glb`,catalog.variants.find(v=>v.species===sp)?.cap_sha256],['shirt_love','pet_body',shirt?.original_asset,shirt?.original_sha256],...details.filter(v=>v.species===sp).map(v=>[v.item_key,v.item_key==='bow_neck'?'pet_neck':'pet_feet',v.asset,v.sha256])];
 for(const [key,slot,path,hash]of entries){if(selected!=='dulce'&&selected!==key)continue;if(!path)throw Error('Esta prenda aún está en construcción');loadout[slot]={style:key,model_asset:path,fitted_model_space:true,skinned_model_space:key!=='cap_pink',asset_revision:hash,tuck_crown_tuft:key==='cap_pink'};if(key==='cap_pink'&&head?.headwear_occlusion)loadout[slot].headwear_occlusion=head.headwear_occlusion;if(key==='shirt_love'){if(shirt?.coverage_asset===null)loadout[slot].covered_skin_triangles={};else loadout[slot].coverage_asset=shirt?.coverage_asset??('assets/runner/restart/shirt-original-coverage-'+sp+'.json');}}if(params.get("inspect_static")==="1")for(const item of Object.values(loadout)){item.preview_static_fit=true;item.preview_hide_finishes=params.get("inspect_finish")==="0";}return loadout;}
function render(){const root=document.querySelector('#pets');root.replaceChildren();for(const [sp,label]of [['penguin','Pingüino'],['bear','Oso'],['pig','Cerdito'],['chick','Pollito']]){if(params.has('species')&&params.get('species')!==sp)continue;const card=document.createElement('article');card.innerHTML=`<h2>${label}</h2>`;root.append(card);try{const loadout=equipment(sp);if(controls.item.value==='dulce'&&Object.keys(loadout).length<4)throw Error('Conjunto de esta mascota todavía en construcción');const q=new URLSearchParams({pet:'1',wardrobe_original_review:controls.motion.value?'1':'0',species:sp,review_angle:controls.angle.value,appearance:JSON.stringify(loadout),v:'dynamic-cloth-4'});if(controls.motion.value){q.set('review_motion',controls.motion.value);q.set('review_phase',controls.phase.value);}const frame=document.createElement('iframe');frame.title=label+' con atuendo nuevo';frame.src='./index.html?'+q;card.append(frame);}catch(e){const note=document.createElement('small');note.textContent=e.message;card.append(note);}}}
for(const c of Object.values(controls))c.addEventListener('change',render);render();
</script></html>
