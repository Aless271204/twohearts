<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIDO · Miniaturas de la tienda</title>
<style>
body{margin:0;background:#fff9fa;color:#292735;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:27px;margin:0}p{color:#786774;line-height:1.5}nav{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}select{border:1px solid #ebccd5;border-radius:14px;background:white;padding:10px;color:#292735;font:inherit}label{display:flex;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}article{overflow:hidden;background:white;border:1px solid #f5e7eb;border-radius:22px;box-shadow:0 5px 20px #c9788d10}img{display:block;width:100%;aspect-ratio:8/7;object-fit:contain;background:#fff5f7}h2{font-size:16px;margin:14px 16px 6px}small{display:block;color:#786774;margin:0 16px 14px}a{display:block;text-align:center;margin:0 16px 16px;padding:10px;background:#f05280;color:white;text-decoration:none;border-radius:20px}#status{font-size:13px}@media(max-width:520px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}h2{margin:12px 10px 6px;font-size:14px}small,a{margin-left:10px;margin-right:10px}}
</style><main><h1>Pequeños detalles, mucho encanto</h1><p>Miniaturas fotografiadas desde los mismos objetos 3D que viste tu mascota.</p><nav><label>Mascota <select id="species"><option value="penguin">Pingüino</option><option value="bear">Oso</option><option value="pig">Cerdito</option><option value="chick">Pollito</option></select></label><label>Categoría <select id="category"><option value="">Todas</option><option value="pet_head">Cabeza</option><option value="pet_eyes">Ojos</option><option value="pet_neck">Cuello</option><option value="pet_body">Cuerpo</option><option value="pet_feet">Patas</option></select></label></nav><p id="status"></p><div class="grid"></div></main>
<script type="module">
const read=async url=>{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar el catálogo');return r.json()};
const [catalog,photos]=await Promise.all([read('accessory-catalog.json'),read('../images/products/wardrobe-thumbnails.json')]);
const species=document.getElementById('species'),category=document.getElementById('category'),root=document.querySelector('.grid');
const params=new URLSearchParams(location.search);if(params.has('species'))species.value=params.get('species');if(params.has('category'))category.value=params.get('category');
const labels={pet_head:'Cabeza',pet_eyes:'Ojos',pet_neck:'Cuello',pet_body:'Cuerpo',pet_feet:'Patas'};
function render(){root.replaceChildren();params.set('species',species.value);params.set('category',category.value);history.replaceState(null,'','?'+params);let count=0;
 for(const item of catalog){if(item.scope!=='pet'||item.visible===false||category.value&&item.equip_slot!==category.value)continue;const photo=photos.find(p=>p.item_key===item.item_key&&p.species===species.value);if(!photo)continue;count++;
  const card=document.createElement('article'),image=document.createElement('img'),title=document.createElement('h2'),label=document.createElement('small'),link=document.createElement('a');
  image.alt=item.name;image.src='../../'+photo.thumbnail+'?v='+photo.thumbnail_sha256;image.loading='lazy';title.textContent=item.name;label.textContent=labels[item.equip_slot]+' · Modelo 3D';link.textContent='Ver puesto';
  link.href='wardrobe-outfit-review.html?'+new URLSearchParams({item:item.item_key,species:species.value,angle:'40',motion:'',live:'0',phase:'.5',outfit:'dulce'});card.append(image,title,label,link);root.append(card);
 }document.getElementById('status').textContent=count+' artículos · La peluca permanece oculta.';
}species.addEventListener('change',render);category.addEventListener('change',render);render();
</script></html>
