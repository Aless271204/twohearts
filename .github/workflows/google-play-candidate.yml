name: NIDO Google Play candidate
on:
  push:
    branches: [codex/play-candidate-133]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nido-play-candidate
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIDO_APPLICATION_ID: app.nido.twohearts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules and release assets
        run: |
          node --test test/snow_engine_test.mjs test/penalty_rules_test.mjs test/maze_engine_test.mjs test/guardian_engine_test.mjs
          python3 scripts/play-preflight.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nido-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: nido-gradle-${{ runner.os }}-
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/login_welcome_test.dart test/local_asset_path_test.dart test/asset_byte_range_test.dart test/contact_settings_test.dart test/partner_location_room_test.dart test/shop_carousel_layout_test.dart test/nido_ranking_test.dart
      - name: Write public runtime configuration
        run: |
          python3 - <<'PY'
          import json
          source=json.load(open('env.json'))
          json.dump({k:source[k] for k in ('SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID') if k in source},open('build-env.json','w'))
          PY
      - name: Restore existing private upload identity
        env:
          STORE: ${{ secrets.NIDO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NIDO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NIDO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIDO_KEY_ALIAS }}
        run: |
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/nido-upload.p12"
          chmod 600 "$RUNNER_TEMP/nido-upload.p12"
          echo "NIDO_KEYSTORE_PATH=$RUNNER_TEMP/nido-upload.p12" >> "$GITHUB_ENV"
          echo "NIDO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NIDO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NIDO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build signed AAB for internal review (not production submission)
        run: flutter build appbundle --release --build-name=1.3.3 --build-number=2031 --dart-define=NIDO_PLAY_BILLING=true --dart-define-from-file=build-env.json
      - name: Verify archive and signing
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          python3 scripts/verify-play-bundle.py build/app/outputs/bundle/release/app-release.aab
          mkdir -p outputs/play-candidate
          cp build/app/outputs/bundle/release/app-release.aab outputs/play-candidate/NIDO-1.3.3-2031-candidate.aab
          sha256sum outputs/play-candidate/*.aab > outputs/play-candidate/SHA256SUMS.txt
          echo "Source: $GITHUB_SHA" > outputs/play-candidate/BUILD.txt
          echo 'Candidate only. Complete privacy, deletion, device testing, and Console declarations before submission.' >> outputs/play-candidate/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NIDO-Google-Play-candidate-2031
          path: outputs/play-candidate/
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nido-upload.p12"
