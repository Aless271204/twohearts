name: NIDO updated Android 1.3.2
on:
  push:
    branches: [codex/web-preview-129]
permissions:
  contents: read
concurrency:
  group: nido-android-132
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIDO_APPLICATION_ID: com.example.twohearts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test test/snow_engine_test.mjs test/penalty_rules_test.mjs test/maze_engine_test.mjs test/guardian_engine_test.mjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nido-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: nido-gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Prepare public build configuration
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('env.json'))
          json.dump({k:d[k] for k in ('SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID') if k in d},open('build-env.json','w'))
          PY
      - name: Restore established signing identity
        env:
          STORE: ${{ secrets.NIDO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NIDO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NIDO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIDO_KEY_ALIAS }}
        run: |
          test -n "$STORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/nido-upload.p12"
          chmod 600 "$RUNNER_TEMP/nido-upload.p12"
          echo "NIDO_KEYSTORE_PATH=$RUNNER_TEMP/nido-upload.p12" >> "$GITHUB_ENV"
          echo "NIDO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NIDO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NIDO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build update-compatible APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=1.3.2 --build-number=27 --dart-define-from-file=build-env.json
      - name: Verify APK identity, signature and assets
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do "$APK_SIGNER" verify --verbose "$apk"; done
          python3 scripts/verify-updated-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: NIDO-Android-1.3.2
          path: outputs/android-132/
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nido-upload.p12"
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nido-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: nido-gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Prepare public configuration
        run: |
          python3 -c "import json;d=json.load(open('env.json'));json.dump({k:d[k] for k in ('SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID') if k in d},open('build-env.json','w'))"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test integration_test/snow_android_test.dart -d emulator-5554 --dart-define-from-file=build-env.json
  publish:
    needs: [build, android-smoke]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: NIDO-Android-1.3.2, path: apk}
      - name: Publish verified Android update for sharing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.txt <<'NOTES'
          NIDO 1.3.2 · actualización de prueba Android.
          Guerra de Nieve: partidas de un minuto, tres mapas, ráfaga polar y flechas/joystick. Incluye los cambios actuales de personalización, habitación y economía.
          APK firmado con la identidad anterior para actualizar sin desinstalar. Compilación y comprobación Android aprobadas. No es una publicación en Google Play; los cobros reales siguen desactivados y persisten revisiones documentadas antes de producción.
          Desarrollador: Alessandro BC · Soporte: alessandroproyectos@gmail.com.
          El APK normal corresponde a Android64bits; el archivo android-32 es para teléfonos32bits.
          NOTES
          gh release create nido-1.3.2 apk/*.apk apk/*.txt apk/*.json --target "$SOURCE_SHA" --title 'NIDO 1.3.2 · Android actualizado' --notes-file release-notes.txt --prerelease
