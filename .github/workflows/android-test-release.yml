name: Deliver tested NIDO Android 1.3.1
on:
  push:
    branches: [codex/web-preview-129]
    paths: [.github/workflows/android-test-release.yml, scripts/publish-android-131.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: nido-android-131-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact signed build and Android startup checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run watch 39190126840 --exit-status --interval 30
      - uses: actions/download-artifact@v4
        with:
          name: twohearts-android-release
          run-id: 39190126840
          github-token: ${{ github.token }}
          path: outputs/android-131
      - name: Verify signer, build identity, assets and Android smoke before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-android-131.py 39190126840 4f69d7292424585ca19e66a2474a13cca685f195
      - uses: actions/upload-artifact@v4
        with:
          name: nido-131-delivery-proof
          path: outputs/delivery-131.json
