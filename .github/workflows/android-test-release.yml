name: Deliver tested NIDO Android 1.3.0
on:
  push:
    branches: [codex/web-preview-129]
    paths: [.github/workflows/android-test-release.yml, scripts/publish-android-130.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: nido-android-130-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact signed build and Android startup checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/39187826966/jobs" --jq '.jobs[] | select(.name=="verify") | .conclusion' | grep -qx success
          for attempt in $(seq 1 40); do
            NIDO_SMOKE_RUN=$(gh run list --workflow android-release-recheck.yml --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$NIDO_SMOKE_RUN" ] && [ "$NIDO_SMOKE_RUN" != "null" ]; then break; fi
            sleep 5
          done
          test -n "$NIDO_SMOKE_RUN"
          test "$NIDO_SMOKE_RUN" != "null"
          gh run watch "$NIDO_SMOKE_RUN" --exit-status --interval 30
          echo "NIDO_SMOKE_RUN=$NIDO_SMOKE_RUN" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: twohearts-android-release
          run-id: 39187826966
          github-token: ${{ github.token }}
          path: outputs/android-130
      - name: Verify signer, build identity, assets and Android smoke before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-android-130.py 39187826966 789a1fee5a828e2e70b01e0cadc55e90c0d6e354 "$NIDO_SMOKE_RUN"
      - uses: actions/upload-artifact@v4
        with:
          name: nido-130-delivery-proof
          path: outputs/delivery-130.json
