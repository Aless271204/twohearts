name: Flutter and forest runner
on:
  push:
    branches: [main, codex/android-local-assets, codex/runner-feedback, codex/pixel-local-rendering, codex/duo-games-inventory, codex/forest-video-loop]
    paths-ignore: [.github/workflows/android-test-download.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    outputs:
      production-signed: ${{ steps.signing.outputs.production }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/runner_replay_test.mjs test/runner_assets_test.mjs test/runner_feedback_test.mjs test/runner_mobile_test.mjs test/runner_art_test.mjs test/inventory_cosmetics_test.mjs test/runner_endless_test.mjs test/pet_accessory_fit_test.mjs test/runner_power_ups_test.mjs test/accessory_glb_test.mjs test/blender_head_fit_test.mjs test/imported_head_models_test.mjs test/room_3d_test.mjs
      - run: node --test test/blender_wardrobe_test.mjs test/blender_complements_test.mjs test/pet_torso_rig_test.mjs test/pet_footwear_coverage_test.mjs test/pet_runner_jump_test.mjs test/pet_runner_run_test.mjs test/pet_sleeve_coverage_test.mjs
      - run: python3 scripts/audit-wardrobe-topology.py --strict
      - run: python3 test/wardrobe_export_seams_test.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/local_asset_path_test.dart test/asset_byte_range_test.dart test/inventory_test.dart test/memory_album_test.dart test/private_memory_image_test.dart test/scene_navigation_test.dart test/rose_ui_test.dart test/twohearts_ui_test.dart test/room_catalog_test.dart test/geographic_location_test.dart test/social_test.dart
      - name: Prepare public build configuration
        run: |
          python3 -c "import json; d=json.load(open('env.json')); json.dump({k:d[k] for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID'] if k in d},open('build-env.json','w'))"
      - run: flutter build web --release --dart-define-from-file=build-env.json
      - uses: actions/upload-artifact@v4
        with:
          name: twohearts-web
          path: build/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: twohearts-android-test-keystore-v1
      - name: Prepare private release signing
        id: signing
        env:
          STORE: ${{ secrets.NIDO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NIDO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NIDO_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIDO_KEY_ALIAS }}
        run: |
          if [ -n "$STORE" ]; then
            printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/nido-upload.p12"
            chmod 600 "$RUNNER_TEMP/nido-upload.p12"
            echo "NIDO_KEYSTORE_PATH=$RUNNER_TEMP/nido-upload.p12" >> "$GITHUB_ENV"
            echo "NIDO_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NIDO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "NIDO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo 'production=true' >> "$GITHUB_OUTPUT"
          else
            echo 'NIDO_ALLOW_TEST_SIGNING=true' >> "$GITHUB_ENV"
            echo 'production=false' >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release --dart-define-from-file=build-env.json
      - name: Verify APK signature
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APK_SIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nido-upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: twohearts-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - name: Prepare public build configuration
        run: |
          python3 -c "import json; d=json.load(open('env.json')); json.dump({k:d[k] for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID'] if k in d},open('build-env.json','w'))"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb -s emulator-5554 shell svc wifi disable
            adb -s emulator-5554 shell svc data disable
            flutter test integration_test/android_assets_test.dart -d emulator-5554 --dart-define-from-file=build-env.json
  publish-forest-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/forest-video-loop' && needs.verify.outputs.production-signed == 'true'
    needs: [verify, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twohearts-android-release
          path: apk
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mv apk/app-release.apk apk/NIDO-1.1.9-actualizada.apk
          sha256sum apk/NIDO-1.1.9-actualizada.apk > apk/NIDO-1.1.9-actualizada.apk.sha256
          printf 'APK de prueba solicitado para conservar el avance de hoy. Vestuario digital: 24 articulos con 96 variantes para pinguino, oso, cerdito y pollito, tejidos con volumen, correcciones de rig y salto, y miniaturas renderizadas del mismo objeto equipado. Habitacion 3D y mejoras de Social. Peluca y cuidado ocultos. Articulos nuevos en previsualizacion; pagos y anuncios reales pendientes.\nFallos conocidos: puños y hombros de algunas prendas requieren mas ajuste durante movimiento; el acabado todavia no es identico a la ilustracion. Punto de continuacion: docs/wardrobe-resume-1814.md.\nVersion: 1.1.9+14\nCommit: %s\nCompilado tras pruebas de Flutter, vestuario, simulacion y recorrido Android sin conexion.\n' "$SOURCE_SHA" > release-notes.txt
          gh release create nido-1.1.9 apk/NIDO-1.1.9-actualizada.apk apk/NIDO-1.1.9-actualizada.apk.sha256 --target "$SOURCE_SHA" --title "NIDO 1.1.9 · Vestuario 3D en prueba" --notes-file release-notes.txt --prerelease
