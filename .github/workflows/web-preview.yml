name: Public NIDO web preview
on:
  push:
    branches: [codex/web-preview-129]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: nido-web-preview
  cancel-in-progress: false
jobs:
  deploy:
    # This exact branch is permitted by the github-pages environment policy.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/small_beret_test.mjs test/runner_kilometre_test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check welcome and Social guides
        run: flutter test test/login_welcome_test.dart test/nido_news_test.dart test/nido_ranking_test.dart test/social_test.dart test/shop_showcase_test.dart test/shop_carousel_layout_test.dart test/duo_training_test.dart test/duo_visual_review_test.dart
      - name: Build this exact web revision
        run: |
          python3 -c "import json; d=json.load(open('env.json')); json.dump({k:d[k] for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID'] if k in d},open('build-env.json','w'))"
          flutter build web --release --dart-define-from-file=build-env.json
          mv build/web preview
      - name: Prepare subdirectory hosting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('preview/index.html')
          source=path.read_text().replace('<base href="/">','<base href="/twohearts/">').replace('<title>twohearts</title>','<title>NIDO · Prueba web</title>')
          path.write_text(source)
          Path('preview/404.html').write_text(source)
          Path('preview/.nojekyll').touch()
          assert not Path('preview/env.json').exists()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - uses: actions/deploy-pages@v4
        id: deployment
