name: NIDO Android closed-test follow-up
on:
  push:
    branches: [codex/play-android-followup]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NIDO_APPLICATION_ID: app.nido.twohearts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nido-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - run: flutter pub get
      - name: Public runtime configuration only
        run: |
          python3 - <<'PY'
          import json
          source=json.load(open('env.json'))
          json.dump({k:source[k] for k in ('SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID') if k in source},open('build-env.json','w'))
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x1920
          disable-animations: true
          script: bash scripts/play-android-followup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nido-android-followup
          path: outputs/play-android-followup/
