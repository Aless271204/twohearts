name: Publish Android test APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-test-download.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twohearts-android-debug
          run-id: 37384826820
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Publish verified APK for phone testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s apk/app-debug.apk
          cp apk/app-debug.apk apk/TwoHearts-1.1.0.apk
          sha256sum apk/TwoHearts-1.1.0.apk
          gh release create android-test-2026-10-05-inventory1 apk/TwoHearts-1.1.0.apk --repo Aless271204/twohearts --target e1591f6d74a86451afe3a5ba39f3bbc46e5f9c20 --prerelease --title "TwoHearts · Android 1.1.0: inventario, juegos y álbumes" --notes "Incluye el inventario de 65 artículos para Pip, habitación, ping pong y preguntas; juegos en pareja y álbumes con hasta cinco fotos desde la galería. Conserva Pip y el bosque. Análisis, pruebas de Flutter, compilaciones web y APK, y prueba de Pip/bosque/sonidos sin conexión pasaron en Actions 37384826820. Guardar álbumes, compras y juegos en pareja requiere conexión e iniciar sesión. Falta probar las partidas en dos teléfonos físicos."
