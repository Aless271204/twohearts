name: Publish Android test APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/android-test-download.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: twohearts-android-debug
          run-id: 37336567536
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Publish verified APK for phone testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s apk/app-debug.apk
          sha256sum apk/app-debug.apk
          gh release create android-test-2026-10-05-fix1 apk/app-debug.apk --repo Aless271204/twohearts --target dc2ca5a2038d5291231bdb9f25628d2538f67278 --prerelease --title "TwoHearts · Android 1.0.2 con sonidos y dificultad progresiva" --notes "Corrige la carga de Pip y el bosque en Android. Añade dificultad progresiva y sonidos cálidos al recoger monedas, saltar y chocar. Compilación web y APK verificadas; prueba de Pip, sus animaciones, bosque y efectos de sonido pasada en emulador Android 35. Desinstala el APK anterior e inicia sesión de nuevo después de instalar. APK de prueba."
