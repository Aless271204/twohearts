name: NIDO widget native compatibility
on:
  push:
    branches: [codex/widgets-visual-136]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Prepare production widget host
        run: |
          python3 scripts/prepare-widget-native-qa.py "$RUNNER_TEMP/nido-widget"
          cd "$RUNNER_TEMP/nido-widget"
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/nido-widget/app/build/outputs/apk/debug/app-debug.apk"
            adb install "$RUNNER_TEMP/nido-widget/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            adb shell appwidget grantbind --package com.example.twohearts.widgetqa --user 0
            mkdir -p outputs/widget-native
            adb shell am instrument -w com.example.twohearts.widgetqa.test/androidx.test.runner.AndroidJUnitRunner | tee outputs/widget-native/result.txt
            grep -q 'OK (3 tests)' outputs/widget-native/result.txt
            adb pull /sdcard/Android/data/com.example.twohearts.widgetqa/files/widget-proof outputs/widget-native/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nido-widget-native-api-${{ matrix.api }}
          path: outputs/widget-native/
