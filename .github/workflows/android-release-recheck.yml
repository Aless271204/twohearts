name: Android release startup recheck
on:
  push:
    branches: [codex/web-preview-129]
    paths: [.github/workflows/android-release-recheck.yml, integration_test/android_assets_test.dart]
permissions:
  contents: read
jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify app sources are identical to the signed build
        run: |
          git fetch --depth=1 origin 789a1fee5a828e2e70b01e0cadc55e90c0d6e354
          git diff --exit-code 789a1fee5a828e2e70b01e0cadc55e90c0d6e354 HEAD -- lib assets android pubspec.yaml pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: nido-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: nido-gradle-${{ runner.os }}-
      - run: flutter pub get
      - name: Prepare public build configuration
        run: python3 -c "import json; d=json.load(open('env.json')); json.dump({k:d[k] for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GOOGLE_WEB_CLIENT_ID'] if k in d},open('build-env.json','w'))"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb -s emulator-5554 shell svc wifi disable
            adb -s emulator-5554 shell svc data disable
            flutter test integration_test/android_assets_test.dart -d emulator-5554 --dart-define-from-file=build-env.json
